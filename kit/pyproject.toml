[project]
name = "toolpick"
version = "0.1.0"
description = "Find out which tool-discovery strategy works best for your agent and your tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.20,<5"]
[project.optional-dependencies]
fast = ["numpy>=1.26"]
spacy = ["spacy>=3.7,<4"]                    # spacy@k; then: python -m spacy download en_core_web_md
laya = ["laya>=0.4,<0.5", "torch>=2.2"]      # category-laya (local CPU model, ~1.3 GB download)
[dependency-groups]
dev = ["pytest>=8,<10"]
[project.scripts]
toolpick = "toolpick.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/toolpick"]
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "toolpick/schemas"
[tool.pytest.ini_options]
testpaths = ["tests"]
