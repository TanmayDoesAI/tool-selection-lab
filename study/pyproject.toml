[project]
name = "tool-selection-lab"
version = "0.1.0"
description = "A controlled synthetic 100-tool discovery benchmark"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "jsonschema>=4.23,<5", "numpy>=2,<3", "spacy>=3.8,<3.9", "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"]
[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]
[project.scripts]
toolbench = "toolbench.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.hatch.build.targets.wheel]
packages = ["src/toolbench"]
[tool.hatch.build.targets.wheel.force-include]
"data" = "toolbench/data"
[tool.hatch.metadata]
allow-direct-references = true
